name: CI

# Pull requests only: every change reaches main through one, so a second run on push would repeat it.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:smoke
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:contracts
