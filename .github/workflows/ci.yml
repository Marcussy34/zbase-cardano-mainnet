name: CI

# Pull requests only: every change reaches main through one, so a second run on push would repeat it.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:smoke
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run check:contracts
      - run: npm run check:budgets
      # The documentation site must build from the current docs/ files.
      - run: npm run docs:build
      # The generated proof fixtures must match their scenarios. Cached proofs need no proving key.
      - run: npm run check:fixtures
      # The blueprint in git must match the sources.
      - run: npm run build:contracts && git diff --exit-code contracts/plutus.json
